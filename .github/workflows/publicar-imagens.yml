# Constrói e publica as imagens do Mesaí no GitHub Container Registry (ghcr.io).
# Roda a cada push na main que altere o código ou o Docker, em tags v*, e manualmente (aba Actions).
name: Publicar imagens no GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "05 - Desenvolvimento/**"
      - "06 - Docker/**"
      - ".github/workflows/publicar-imagens.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: backend
          - servico: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mesai-${{ matrix.servico }}" >> "$GITHUB_OUTPUT"

      - name: Tags e rótulos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nome.outputs.imagem }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=mesai-${{ matrix.servico }}
            org.opencontainers.image.description=Mesaí — Cantina 67 (${{ matrix.servico }})

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: "05 - Desenvolvimento/${{ matrix.servico }}"
          file: "06 - Docker/${{ matrix.servico }}.Dockerfile"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
