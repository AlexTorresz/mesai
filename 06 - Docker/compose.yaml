# Mesaí — Cantina 67 | Ambiente reproduzível (RNF-09)
# Subir:   docker compose up -d --build      (na raiz do projeto ou nesta pasta)
# Acessar: http://localhost:8080  (sistema)   http://localhost:8025 (caixa de e-mails de teste)
name: mesai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mesai}
      POSTGRES_USER: ${POSTGRES_USER:-mesai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesai_dev_troque}
    volumes:
      - mesai-db:/var/lib/postgresql/data # dados persistem após reinício
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Servidor SMTP de testes: recebe os e-mails de "Esqueci minha senha" (RF-05)
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  backend:
    # Imagem publicada no GHCR. "docker compose pull" baixa a pronta; "--build" constrói localmente.
    image: ghcr.io/alextorresz/mesai-backend:${MESAI_TAG:-latest}
    build:
      context: "../05 - Desenvolvimento/backend"
      dockerfile: "../../06 - Docker/backend.Dockerfile"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-mesai}:${POSTGRES_PASSWORD:-mesai_dev_troque}@db:5432/${POSTGRES_DB:-mesai}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-no-arquivo-env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      INACTIVITY_MINUTES: ${INACTIVITY_MINUTES:-30}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-30}
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false} # true somente atrás de HTTPS
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SEED_GERENTE_EMAIL: ${SEED_GERENTE_EMAIL:-gerente@cantina67.com.br}
      SEED_GERENTE_PASSWORD: ${SEED_GERENTE_PASSWORD:-Mesai@2026}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Mesai@2026}
    volumes:
      - mesai-uploads:/app/uploads # fotos dos pratos persistem após reinício
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ghcr.io/alextorresz/mesai-frontend:${MESAI_TAG:-latest}
    build:
      context: "../05 - Desenvolvimento/frontend"
      dockerfile: "../../06 - Docker/frontend.Dockerfile"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mesai-db:
  mesai-uploads:
